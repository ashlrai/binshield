name: BinShield Action Smoke

on:
  pull_request:

permissions:
  contents: read

jobs:
  binshield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The action reads npm lockfiles. Use an empty npm fixture to exercise
      # its manifest and compiled entry point without calling the live API.
      - name: Create an empty npm fixture
        run: |
          fixture="$(mktemp -d "$RUNNER_TEMP/binshield-smoke.XXXXXX")"
          printf '{"name":"binshield-smoke","version":"0.0.0"}\n' > "$fixture/package.json"
          printf '{"lockfileVersion":3,"packages":{}}\n' > "$fixture/package-lock.json"
          echo "BINSHIELD_SMOKE_DIR=$fixture" >> "$GITHUB_ENV"
      - name: Start the local action
        uses: ./apps/github-action
        with:
          working-directory: ${{ env.BINSHIELD_SMOKE_DIR }}
