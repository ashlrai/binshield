name: CI

on:
  # push is scoped to main only: pull_request already covers every branch/PR,
  # and firing push unconditionally too causes duplicate concurrent runs for
  # the same commit (push + pull_request), which starves apps/worker's
  # binary-extraction tests of CPU and trips their 5s timeouts under
  # contention. main-only push still gets `verify` on every merge commit.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify GitHub Action dist is up to date
        run: |
          pnpm --filter @binshield/github-action build
          if ! git diff --exit-code apps/github-action/dist; then
            echo "::error::apps/github-action/dist is stale — run 'pnpm --filter @binshield/github-action build' and commit the result."
            exit 1
          fi
